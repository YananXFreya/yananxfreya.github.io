<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="YananXFreya 的个人主页。简历、个人经历与项目记录将陆续更新。">
  <meta name="color-scheme" content="light">
  <title>YananXFreya · 个人主页</title>
  <style>
    :root { color-scheme: light; --ink: #142b40; --muted: #526577; --accent: #11685b; --line: #dce5e8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f9fb; color: var(--ink); font: 17px/1.8 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    a { color: var(--accent); text-underline-offset: .22em; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .wrap { width: min(100% - 48px, 1040px); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; letter-spacing: -.02em; text-decoration: none; color: var(--ink); }
    .github { font-size: .94rem; }
    main { padding: 84px 0 72px; }
    .eyebrow { color: var(--accent); font-size: .88rem; letter-spacing: .14em; font-weight: 650; }
    h1 { font-size: clamp(2.5rem, 6.4vw, 4.6rem); letter-spacing: -.055em; line-height: 1.13; margin: 22px 0 24px; overflow-wrap: anywhere; }
    .intro { max-width: 630px; color: var(--muted); font-size: 1.13rem; margin: 0; }
    .button { display: inline-flex; margin-top: 32px; padding: 11px 22px; border-radius: 8px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 600; }
    .button:hover { background: #23455f; }
    .sections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 76px; }
    .section { border-top: 2px solid var(--line); padding-top: 20px; }
    h2 { font-size: 1.15rem; margin: 0 0 10px; }
    .section p { color: var(--muted); font-size: 1rem; margin: 0; }
    .note { margin-top: 48px; color: var(--muted); font-size: .9rem; }
    footer { border-top: 1px solid var(--line); padding: 24px 0; color: var(--muted); font-size: .88rem; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    @media (max-width: 640px) {
      .wrap { width: calc(100% - 36px); }
      header { padding: 22px 0; }
      main { padding: 54px 0 48px; }
      .sections { grid-template-columns: 1fr; gap: 28px; margin-top: 50px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="./" aria-label="YananXFreya 个人主页">YananXFreya</a>
      <a class="github" href="https://github.com/YananXFreya">GitHub</a>
    </header>
    <main>
      <div class="eyebrow">PERSONAL HOMEPAGE</div>
      <h1>你好，我是<br>YananXFreya。</h1>
      <p class="intro">欢迎来到我的个人主页。这里将记录我的个人经历、学习与工作，以及值得分享的项目。</p>
      <a class="button" href="https://github.com/YananXFreya">访问我的 GitHub</a>
      <div class="sections" aria-label="主页内容">
        <section class="section">
          <h2>关于我</h2>
          <p>个人介绍与兴趣方向，整理中。</p>
        </section>
        <section class="section">
          <h2>简历与经历</h2>
          <p>教育背景、工作经历与个人简历，待更新。</p>
        </section>
        <section class="section">
          <h2>项目与记录</h2>
          <p>项目成果和学习记录，陆续补充。</p>
        </section>
      </div>
      <p class="note">主页正在建设中，更多内容即将更新。</p>
    </main>
    <footer><span>© YananXFreya</span><span>个人主页</span></footer>
  </div>
</body>
</html>
